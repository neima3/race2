<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RACE2" />
  <meta name="theme-color" content="#0b0e1a" />
  <meta name="description" content="RACE2 — a Trackmania-style arcade time-trial racer. Play with keyboard, touch, or gamepad." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <title>RACE2 — Arcade Racer</title>
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>
    <div id="speedlines"></div>
    <div id="vignette"></div>
    <div id="ui-root"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.register('./sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
